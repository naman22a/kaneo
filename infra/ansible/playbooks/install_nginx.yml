---
- name: Install and configure Nginx
  hosts: servers
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Nginx
      package:
        name: nginx
        state: present

    - name: Enable and start Nginx
      systemd:
        name: nginx
        state: started
        enabled: true
